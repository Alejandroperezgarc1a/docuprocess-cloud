# Integración continua: ningún cambio llega a main sin ser validado por una máquina.
# No despliega en AWS (ver docs/architecture.md): el Sandbox usa credenciales temporales
# y no permite crear el rol OIDC que GitHub necesitaría.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detecta qué partes del repositorio existen; los jobs de partes aún no construidas se saltan.
  detect:
    name: Detectar componentes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.d.outputs.infra }}
      python: ${{ steps.d.outputs.python }}
      frontend: ${{ steps.d.outputs.frontend }}
      scripts: ${{ steps.d.outputs.scripts }}
      package: ${{ steps.d.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          has() { compgen -G "$1" >/dev/null && echo true || echo false; }
          {
            echo "infra=$(has 'infra/*.tf')"
            echo "python=$(has 'app/*/requirements.txt')"
            echo "frontend=$(has 'frontend/package.json')"
            echo "scripts=$(has 'scripts/*.sh')"
            echo "package=$(has 'scripts/package-app.sh')"
          } | tee -a "$GITHUB_OUTPUT"

  terraform:
    name: Terraform (fmt + validate)
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: Formato
        run: terraform fmt -check -recursive -diff
      - name: Init (sin backend ni credenciales)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  python:
    name: Pruebas Python 3.9 (${{ matrix.component }})
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    # Mismo sistema y misma versión de Python que las EC2 (Amazon Linux 2023, Python 3.9)
    container: amazonlinux:2023
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker]
    steps:
      - name: Herramientas base
        run: dnf install -y -q python3-pip tar gzip git
      - uses: actions/checkout@v4
      - name: Existe el componente
        id: exists
        run: test -f app/${{ matrix.component }}/requirements.txt && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - name: Dependencias
        if: steps.exists.outputs.ok == 'true'
        working-directory: app/${{ matrix.component }}
        run: |
          python3 --version
          python3 -m pip install -q -r requirements.txt
          if [ -f requirements-dev.txt ]; then python3 -m pip install -q -r requirements-dev.txt; else python3 -m pip install -q pytest; fi
      - name: Pruebas
        if: steps.exists.outputs.ok == 'true'
        working-directory: app/${{ matrix.component }}
        run: |
          if [ -d tests ]; then python3 -m pytest -q tests; else echo "Sin carpeta tests/ todavía"; fi

  frontend:
    name: Frontend (Vite build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Build
        run: npm run build

  shellcheck:
    name: ShellCheck
    needs: detect
    if: needs.detect.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Los .tftpl no se analizan: son plantillas de Terraform con interpolaciones ${...}
      - run: shellcheck --version && shellcheck scripts/*.sh

  package:
    name: Empaquetado de la app
    needs: [detect, python]
    if: needs.detect.outputs.package == 'true' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: docuprocess-app
          path: dist/docuprocess-app.zip
          retention-days: 7
