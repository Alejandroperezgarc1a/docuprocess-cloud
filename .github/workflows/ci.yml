# Integración continua: ningún cambio llega a main sin ser validado por una máquina.
# No despliega en AWS (ver docs/architecture.md): el Sandbox usa credenciales temporales
# y no permite crear el rol OIDC que GitHub necesitaría.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detecta qué partes del repositorio existen; los jobs de partes aún no construidas se saltan.
  detect:
    name: Detectar componentes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.d.outputs.infra }}
      node: ${{ steps.d.outputs.node }}
      frontend: ${{ steps.d.outputs.frontend }}
      scripts: ${{ steps.d.outputs.scripts }}
      package: ${{ steps.d.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          has() { compgen -G "$1" >/dev/null && echo true || echo false; }
          {
            echo "infra=$(has 'infra/*.tf')"
            echo "node=$(has 'app/*/package.json')"
            echo "frontend=$(has 'frontend/package.json')"
            echo "scripts=$(has 'scripts/*.sh')"
            echo "package=$(has 'scripts/package-app.sh')"
          } | tee -a "$GITHUB_OUTPUT"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform (fmt + validate)
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: Formato
        run: terraform fmt -check -recursive -diff
      - name: Init (sin backend ni credenciales)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  node:
    name: Pruebas Node 24 (${{ matrix.component }})
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    # Mismo sistema y misma versión de Node que las EC2 (Amazon Linux 2023, nodejs24)
    container: amazonlinux:2023
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker]
    steps:
      - name: Herramientas base
        run: dnf install -y -q nodejs24 nodejs24-npm tar gzip git
      - uses: actions/checkout@v4
      - name: Existe el componente
        id: exists
        run: test -f app/${{ matrix.component }}/package.json && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - name: Dependencias
        if: steps.exists.outputs.ok == 'true'
        working-directory: app/${{ matrix.component }}
        run: |
          node --version
          npm --version
          npm ci
      - name: Tipos y build
        if: steps.exists.outputs.ok == 'true'
        working-directory: app/${{ matrix.component }}
        run: |
          npm run typecheck
          npm run build
      - name: Pruebas
        if: steps.exists.outputs.ok == 'true'
        working-directory: app/${{ matrix.component }}
        run: |
          if [ -d tests ]; then npm test; else echo "Sin carpeta tests/ todavía"; fi

  frontend:
    name: Frontend (Vite build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Build
        run: npm run build

  shellcheck:
    name: ShellCheck
    needs: detect
    if: needs.detect.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version && shellcheck scripts/*.sh
      # Las plantillas .tftpl se renderizan con templatefile() (las dos ramas: con artefacto y
      # provisional) y se analiza el bash resultante.
      - uses: hashicorp/setup-terraform@v3
        if: hashFiles('scripts/user-data.sh.tftpl') != ''
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: ShellCheck del userData renderizado
        if: hashFiles('scripts/user-data.sh.tftpl') != ''
        run: |
          tpl="$PWD/scripts/user-data.sh.tftpl"
          work="$(mktemp -d)"
          for key in releases/app-ci.zip ""; do
            vars="aws_region=\"us-east-1\", db_password_param=\"/p/db\", jwt_secret_param=\"/p/jwt\", db_password_version=1, jwt_secret_version=1, db_host=\"db.example\", db_port=3306, db_name=\"docuprocess\", db_user=\"docuadmin\", ddb_table=\"documents\", ddb_events_table=\"document_events\", ddb_transactions=true, docs_bucket=\"docs\", sns_topic_arn=\"\", artifacts_bucket=\"artifacts\", artifact_key=\"$key\", worker_poll_seconds=5, worker_batch_size=10, upload_timeout_minutes=15, max_file_mb=10"
            echo "templatefile(\"$tpl\", {$vars})" \
              | (cd "$work" && terraform console) | sed '1{/^<<EOT$/d};${/^EOT$/d}' > "$work/ud.sh"
            echo "--- variante: ${key:-provisional} ($(wc -l < "$work/ud.sh") líneas)"
            shellcheck "$work/ud.sh"
          done

  package:
    name: Empaquetado de la app
    needs: [detect, node]
    if: needs.detect.outputs.package == 'true' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: ./scripts/package-app.sh
      - name: Determinismo y contenido del zip
        run: |
          first="$(md5sum dist/docuprocess-app.zip | cut -d' ' -f1)"
          ./scripts/package-app.sh
          second="$(md5sum dist/docuprocess-app.zip | cut -d' ' -f1)"
          echo "md5: $first / $second"
          test "$first" = "$second" || { echo "::error::El zip no es determinista"; exit 1; }
          list="$(unzip -Z1 dist/docuprocess-app.zip)"
          grep -q '^api/dist/server.js$' <<<"$list" || { echo "::error::Falta api/dist/server.js"; exit 1; }
          grep -q '^worker/dist/worker.js$' <<<"$list" || { echo "::error::Falta worker/dist/worker.js"; exit 1; }
          if grep -E '\.map$|^[^/]+/(src|tests)/|node_modules/(typescript|tsx|supertest|@types)/' <<<"$list"; then
            echo "::error::El zip trae fuentes, mapas o dependencias de desarrollo"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: docuprocess-app
          path: dist/docuprocess-app.zip
          retention-days: 7
